---
- name: Contas, acesso SSH e sudo da equipe de análise
  hosts: analise
  become: true
  vars_files:
    - vars/equipe.yml
  tasks:
    - name: Garantir o grupo da equipe
      ansible.builtin.group:
        name: "{{ equipe_grupo }}"
        state: present

    - name: Garantir as contas da equipe
      ansible.builtin.user:
        name: "{{ item['nome'] }}"
        comment: "{{ item['comentario'] }}"
        shell: /bin/bash
        groups: "{{ equipe_grupo }}"
        append: true
        state: present
      loop: "{{ equipe_usuarios }}"

    - name: Autorizar a chave pública de cada membro
      ansible.posix.authorized_key:
        user: "{{ item['nome'] }}"
        key: "https://chaves.example.net/{{ item['nome'] }}.pub"
        state: present
      loop: "{{ equipe_usuarios }}"

    - name: Permitir sudo sem senha para o grupo
      ansible.builtin.lineinfile:
        path: "/etc/sudoers.d/{{ equipe_grupo }}"
        line: "%{{ equipe_grupo }} ALL=(ALL) NOPASSWD: ALL"
        state: present
        create: true
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Desabilitar login direto do root por SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^PermitRootLogin'
        line: PermitRootLogin no
        validate: /usr/sbin/sshd -t -f %s
      notify: Reiniciar o sshd

  handlers:
    - name: Reiniciar o sshd
      ansible.builtin.systemd_service:
        name: sshd
        state: restarted
