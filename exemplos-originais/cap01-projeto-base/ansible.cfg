# ansible.cfg — configuração do PROJETO (exemplo autoral, AU294 Cap. 1)
# Fica na raiz do projeto: vence ~/.ansible.cfg e /etc/ansible/ansible.cfg,
# mas perde para a variável de ambiente ANSIBLE_CONFIG.

[defaults]
# Inventário relativo à raiz do projeto (arquivo ou diretório)
inventory = ./inventory
# Usuário remoto usado na conexão SSH. Sem esta linha, dentro de um
# execution environment o ansible-navigator tenta conectar como root.
remote_user = automacao
# Autenticação por chave SSH: não pedir senha de SSH
ask_pass = false

[privilege_escalation]
# Escalada desligada por padrão: ative "become: true" só nos plays/tasks que
# precisam de root. Valores abaixo são os padrões, explícitos por clareza.
become = false
become_method = sudo
become_user = root
become_ask_pass = false
