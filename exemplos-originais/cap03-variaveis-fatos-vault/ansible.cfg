# ansible.cfg — exemplo autoral, AU294 Cap. 3
[defaults]
inventory = ./inventory
remote_user = automacao
ask_pass = false
; senha do vault ID "exemplo" lida de um arquivo LOCAL, nunca versionado
; (criar com: echo 'estudo-au294-ficticia' > .vault-exemplo && chmod 600 .vault-exemplo)
vault_identity_list = exemplo@.vault-exemplo

[privilege_escalation]
become = false
