---
# ansible-navigator.yml — exemplo autoral, AU294 Cap. 3
ansible-navigator:
  execution-environment:
    container-engine: podman
    enabled: true
    image: registry.redhat.io/ansible-automation-platform-26/ee-supported-rhel9:latest
    pull:
      policy: missing
  mode: stdout                  # obrigatório para prompts de senha do vault
  playbook-artifact:
    enable: false               # não grava valores decifrados em JSON
